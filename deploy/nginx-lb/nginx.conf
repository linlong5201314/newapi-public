worker_processes auto;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:100m max_size=3g inactive=7d use_temp_path=off;

    # 每请求按权重挑一台节点；同一份前端产物在各节点上是同一个 bundle，所以缓存 key 只按 URI。
    split_clients "$request_id" $nodekey {
        18%  n1;
        14%  n2;
        14%  n4;
        14%  n5;
        14%  n6;
        13%  n7;
        13%  n8;
    }

    map $nodekey $node_host {
        n1  "newapi-public-production.up.railway.app";
        n2  "newapi-public-production-49b4dfb0.up.railway.app";
        n4  "newapi-public-production-91f2142c.up.railway.app";
        n5  "newapi-public-production-1c18a29a.up.railway.app";
        n6  "newapi-public-production-782d8c37.up.railway.app";
        n7  "newapi-public-production-2113ed4c.up.railway.app";
        n8  "newapi-public-production-49f64774.up.railway.app";
    }

    map $nodekey $node_url {
        n1  "https://newapi-public-production.up.railway.app";
        n2  "https://newapi-public-production-49b4dfb0.up.railway.app";
        n4  "https://newapi-public-production-91f2142c.up.railway.app";
        n5  "https://newapi-public-production-1c18a29a.up.railway.app";
        n6  "https://newapi-public-production-782d8c37.up.railway.app";
        n7  "https://newapi-public-production-2113ed4c.up.railway.app";
        n8  "https://newapi-public-production-49f64774.up.railway.app";
    }

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 64m;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $node_host;
        proxy_set_header Host $node_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location ^~ /static/ {
            proxy_pass $node_url$request_uri;
            proxy_cache static;
            proxy_cache_key "$request_uri|$http_range";
            add_header Accept-Ranges bytes always;
            proxy_cache_valid 200 206 7d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-LB-Node $nodekey always;
            add_header X-LB-Cache $upstream_cache_status always;
        }

        location / {
            proxy_pass $node_url$request_uri;
            proxy_buffering off;
            add_header X-LB-Node $nodekey always;
        }
    }
}

