worker_processes auto;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    map_hash_bucket_size 256;

    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:100m max_size=3g inactive=7d use_temp_path=off;

    # Each group name is the host name Railway routes on. A variable resolving
    # to a group uses that group, preserving both SNI and Host on every hop.
    upstream newapi-public-production.up.railway.app { server newapi-public-production.up.railway.app:443; }
    upstream newapi-public-production-49b4dfb0.up.railway.app { server newapi-public-production-49b4dfb0.up.railway.app:443; }
    upstream newapi-public-production-91f2142c.up.railway.app { server newapi-public-production-91f2142c.up.railway.app:443; }
    upstream newapi-public-production-1c18a29a.up.railway.app { server newapi-public-production-1c18a29a.up.railway.app:443; }
    upstream newapi-public-production-782d8c37.up.railway.app { server newapi-public-production-782d8c37.up.railway.app:443; }
    upstream newapi-public-production-2113ed4c.up.railway.app { server newapi-public-production-2113ed4c.up.railway.app:443; }
    upstream newapi-public-production-49f64774.up.railway.app { server newapi-public-production-49f64774.up.railway.app:443; }

    split_clients "$request_id" $pick {
        18%  newapi-public-production.up.railway.app;
        14%  newapi-public-production-49b4dfb0.up.railway.app;
        14%  newapi-public-production-91f2142c.up.railway.app;
        14%  newapi-public-production-1c18a29a.up.railway.app;
        14%  newapi-public-production-782d8c37.up.railway.app;
        13%  newapi-public-production-2113ed4c.up.railway.app;
        13%  newapi-public-production-49f64774.up.railway.app;
    }

    map $pick $hop2 {
        newapi-public-production.up.railway.app  newapi-public-production-49b4dfb0.up.railway.app;
        newapi-public-production-49b4dfb0.up.railway.app  newapi-public-production-91f2142c.up.railway.app;
        newapi-public-production-91f2142c.up.railway.app  newapi-public-production-1c18a29a.up.railway.app;
        newapi-public-production-1c18a29a.up.railway.app  newapi-public-production-782d8c37.up.railway.app;
        newapi-public-production-782d8c37.up.railway.app  newapi-public-production-2113ed4c.up.railway.app;
        newapi-public-production-2113ed4c.up.railway.app  newapi-public-production-49f64774.up.railway.app;
        newapi-public-production-49f64774.up.railway.app  newapi-public-production.up.railway.app;
    }

    map $pick $hop3 {
        newapi-public-production.up.railway.app  newapi-public-production-91f2142c.up.railway.app;
        newapi-public-production-49b4dfb0.up.railway.app  newapi-public-production-1c18a29a.up.railway.app;
        newapi-public-production-91f2142c.up.railway.app  newapi-public-production-782d8c37.up.railway.app;
        newapi-public-production-1c18a29a.up.railway.app  newapi-public-production-2113ed4c.up.railway.app;
        newapi-public-production-782d8c37.up.railway.app  newapi-public-production-49f64774.up.railway.app;
        newapi-public-production-2113ed4c.up.railway.app  newapi-public-production.up.railway.app;
        newapi-public-production-49f64774.up.railway.app  newapi-public-production-49b4dfb0.up.railway.app;
    }

    map $pick $hop4 {
        newapi-public-production.up.railway.app  newapi-public-production-1c18a29a.up.railway.app;
        newapi-public-production-49b4dfb0.up.railway.app  newapi-public-production-782d8c37.up.railway.app;
        newapi-public-production-91f2142c.up.railway.app  newapi-public-production-2113ed4c.up.railway.app;
        newapi-public-production-1c18a29a.up.railway.app  newapi-public-production-49f64774.up.railway.app;
        newapi-public-production-782d8c37.up.railway.app  newapi-public-production.up.railway.app;
        newapi-public-production-2113ed4c.up.railway.app  newapi-public-production-49b4dfb0.up.railway.app;
        newapi-public-production-49f64774.up.railway.app  newapi-public-production-91f2142c.up.railway.app;
    }

    map $pick $hop5 {
        newapi-public-production.up.railway.app  newapi-public-production-782d8c37.up.railway.app;
        newapi-public-production-49b4dfb0.up.railway.app  newapi-public-production-2113ed4c.up.railway.app;
        newapi-public-production-91f2142c.up.railway.app  newapi-public-production-49f64774.up.railway.app;
        newapi-public-production-1c18a29a.up.railway.app  newapi-public-production.up.railway.app;
        newapi-public-production-782d8c37.up.railway.app  newapi-public-production-49b4dfb0.up.railway.app;
        newapi-public-production-2113ed4c.up.railway.app  newapi-public-production-91f2142c.up.railway.app;
        newapi-public-production-49f64774.up.railway.app  newapi-public-production-1c18a29a.up.railway.app;
    }

    map $pick $hop6 {
        newapi-public-production.up.railway.app  newapi-public-production-2113ed4c.up.railway.app;
        newapi-public-production-49b4dfb0.up.railway.app  newapi-public-production-49f64774.up.railway.app;
        newapi-public-production-91f2142c.up.railway.app  newapi-public-production.up.railway.app;
        newapi-public-production-1c18a29a.up.railway.app  newapi-public-production-49b4dfb0.up.railway.app;
        newapi-public-production-782d8c37.up.railway.app  newapi-public-production-91f2142c.up.railway.app;
        newapi-public-production-2113ed4c.up.railway.app  newapi-public-production-1c18a29a.up.railway.app;
        newapi-public-production-49f64774.up.railway.app  newapi-public-production-782d8c37.up.railway.app;
    }

    map $pick $hop7 {
        newapi-public-production.up.railway.app  newapi-public-production-49f64774.up.railway.app;
        newapi-public-production-49b4dfb0.up.railway.app  newapi-public-production.up.railway.app;
        newapi-public-production-91f2142c.up.railway.app  newapi-public-production-49b4dfb0.up.railway.app;
        newapi-public-production-1c18a29a.up.railway.app  newapi-public-production-91f2142c.up.railway.app;
        newapi-public-production-782d8c37.up.railway.app  newapi-public-production-1c18a29a.up.railway.app;
        newapi-public-production-2113ed4c.up.railway.app  newapi-public-production-782d8c37.up.railway.app;
        newapi-public-production-49f64774.up.railway.app  newapi-public-production-2113ed4c.up.railway.app;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 6s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # A request is read before proxying, so a retry can replay a POST body.
    proxy_request_buffering on;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 64m;

        location ^~ /static/ {
            proxy_pass https://$pick;
            proxy_cache static;
            proxy_cache_bypass $http_range;
            proxy_no_cache $http_range;
            proxy_cache_key "$request_uri|$http_range";
            add_header Accept-Ranges bytes always;
            proxy_cache_valid 200 206 7d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-LB-Node $pick always;
            add_header X-LB-Cache $upstream_cache_status always;
        }

        location / {
            proxy_pass https://$pick;
            proxy_buffering off;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @retry2;
            add_header X-LB-Node $pick always;
            add_header X-LB-Addr $upstream_addr always;
            add_header X-LB-Tries $upstream_status always;
        }

        location @retry2 {
            internal;
            proxy_pass https://$hop2;
            proxy_buffering off;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @retry3;
            add_header X-LB-Node $hop2 always;
            add_header X-LB-Addr $upstream_addr always;
            add_header X-LB-Tries "retry2" always;
        }

        location @retry3 {
            internal;
            proxy_pass https://$hop3;
            proxy_buffering off;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @retry4;
            add_header X-LB-Node $hop3 always;
            add_header X-LB-Addr $upstream_addr always;
            add_header X-LB-Tries "retry3" always;
        }

        location @retry4 {
            internal;
            proxy_pass https://$hop4;
            proxy_buffering off;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @retry5;
            add_header X-LB-Node $hop4 always;
            add_header X-LB-Addr $upstream_addr always;
            add_header X-LB-Tries "retry4" always;
        }

        location @retry5 {
            internal;
            proxy_pass https://$hop5;
            proxy_buffering off;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @retry6;
            add_header X-LB-Node $hop5 always;
            add_header X-LB-Addr $upstream_addr always;
            add_header X-LB-Tries "retry5" always;
        }

        location @retry6 {
            internal;
            proxy_pass https://$hop6;
            proxy_buffering off;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @retry7;
            add_header X-LB-Node $hop6 always;
            add_header X-LB-Addr $upstream_addr always;
            add_header X-LB-Tries "retry6" always;
        }

        location @retry7 {
            internal;
            proxy_pass https://$hop7;
            proxy_buffering off;
            proxy_intercept_errors on;
            add_header X-LB-Node $hop7 always;
            add_header X-LB-Addr $upstream_addr always;
            add_header X-LB-Tries "retry7" always;
        }
    }
}
